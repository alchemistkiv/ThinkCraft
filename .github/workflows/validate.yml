name: Validate thinkcraft

on:
  pull_request:
  push:
    branches:
      - main
      - "improve/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package source
        run: python tests/validate_package.py

      - name: Check disk-command projection drift
        run: python tests/check_projection_drift.py
